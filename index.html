ody .button{background:var(--lime);color:var(--green)}.toast{position:fixed;left:50%;top:max(18px,env(safe-area-inset-top));transform:translate(-50%,-20px);background:#203a29;color:#fff;border-radius:13px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
  <main class="app">
    <header class="hero"><div class="eyebrow">我的时间执行表</div><h1>今天，按标准推进</h1><div class="sub" id="dateLabel"></div><div class="count" id="countLabel"></div><div class="progress"><i id="progressBar"></i></div></header>

      <div class="section-head"><h2>今日时间线</h2><span>点击圆圈完成打卡</span></div><div class="timeline" id="timeline"></div>
    </section>

      <div class="card"><div class="section-head" style="margin:0 0 8px"><h2>本周安排</h2><span id="weekStart"></span></div><div id="weekRows"></div></div>
    </section>
    <section class="panel" id="settings">
      <div class="card setting"><div><h2 style="margin-top:0">页面到点弹窗</h2><p>页面打开时，到达每项开始时间会显示安排与执行标准。</p><button class="button soft" id="testPopup">测试弹窗</button></div><label class="switch"><input id="notificationSwitch" type="checkbox" aria-label="开启到点弹窗"><span class="slider"></span></label></div>
      <div class="calendar-card"><h2 style="margin:0">页面关闭也提醒</h2><p>导出本周日历并导入手机日历，到点由手机系统通知。排班变化后重新导出即可。</p><button class="button" id="exportCalendar">导出本周系统提醒</button></div>
      <div class="card note"><h2 style="margin-top:0">使用说明</h2><ol><li>先在“本周”选择工作一的3天。</li><li>开启页面弹窗；不需要提醒的项目可点铃铛关闭。</li><li>锁屏或关闭页面后仍要提醒，请导入本周日历。</li></ol></div>
    </section>
  </main>
  <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-card"><div class="modal-top"><small>🔔 现在开始</small><h2 id="modalTitle"></h2><p id="modalMeta"></p></div><div class="modal-body"><small>执行标准</small><p id="modalStandard"></p><button class="button" id="closeModal">知道了，开始执行</button></div></div></div><div class="toast" id="toast"></div>
  <script>
    const item=(id,time,start,end,title,standard,priority)=>({id,time,start,end,title,standard,priority});
    const workOne=[
      item('w1-wake','06:50','06:50','07:00','起床','拉开窗帘，喝300–400 ml水；不要求晨练','核心'),item('w1-wash','07:00–07:15','07:00','07:15','洗漱＋活动','拉伸3–5分钟；有自然光就接触一下','常规'),item('w1-breakfast','07:15–07:35','07:15','07:35','早餐','蛋白质＋主食＋水果；尽量不要完全不吃','核心'),item('w1-coffee','07:35–07:50','07:35','07:50','咖啡','美式或拿铁，一杯即可，尽量无糖或少糖','常规'),item('w1-ready','07:50–08:20','07:50','08:20','上班准备','换衣、整理电脑/钥匙/水杯；08:20固定出门','核心'),item('w1-commute','08:20–09:00','08:20','09:00','上班通勤','单程40分钟，把通勤当作状态切换','核心'),item('w1-am','09:00–12:00','09:00','12:00','上午工作','约50分钟专注＋10分钟离屏；至少每小时起身一次','核心'),item('w1-snack-am','10:30左右','10:30','10:40','可选加餐','不饿不吃；水果/酸奶/牛奶/少量坚果选一','可选'),item('w1-lunch','12:00–12:40','12:00','12:40','午餐','较多蔬菜＋足量蛋白质＋正常主食，不刻意少吃','核心'),item('w1-walk','12:40–13:00','12:40','13:00','饭后散步','轻松走10–20分钟；天气不好就在室内走','常规'),item('w1-nap','13:00–13:20','13:00','13:20','午休','睡15–20分钟；睡不着就闭眼休息','常规'),item('w1-pm-ready','13:20–13:30','13:20','13:30','下午准备','整理桌面、补水，确定下午首项任务','常规'),item('w1-pm','13:30–16:30','13:30','16:30','下午工作','正常喝水；仍以约50分钟活动一下为参考','核心'),item('w1-snack','16:30–17:00','16:30','17:00','训练前加餐','当天最后一次进食：蛋白质＋少量碳水','核心'),item('w1-wrap','17:00–17:30','17:00','17:30','工作收尾','处理简单事项，写下明天最重要的1–3件事','常规'),item('w1-home','17:30–18:20','17:30','18:20','下班＋通勤','单程约40分钟，并预留10分钟缓冲','常规'),item('w1-exercise','18:30–19:15','18:30','19:15','运动','力量/有氧/快走；特别累则散步＋拉伸','核心'),item('w1-recover','19:15以后','19:15','20:00','洗澡＋恢复','不吃正式晚餐；运动后正常喝水，不用喝水压饿','核心'),item('w1-study1','20:00–21:00','20:00','21:00','第一轮学习','只确定一个核心任务，如英语、阅读或项目工作','核心'),item('w1-break','21:00–21:10','21:00','21:10','离屏休息','走动3–5分钟、看远处、喝水、简单伸展','常规'),item('w1-study2','21:10–22:00','21:10','22:00','第二轮学习','优先复习、整理、阅读；疲劳时改轻松活动','常规'),item('w1-night','22:00–23:00','22:00','23:00','睡前收尾','洗漱、拉伸、收拾用品，降低灯光和手机刺激','核心'),item('w1-sleep','23:00','23:00','23:59','睡觉','固定入睡时间，保证次日06:50起床','核心')];
    const workTwo=[
      item('w2-wake','06:50','06:50','07:00','起床','拉开窗帘，喝300–400 ml水','核心'),item('w2-wash','07:00–07:15','07:00','07:15','洗漱＋活动','拉伸3–5分钟，接触自然光','常规'),item('w2-breakfast','07:15–07:35','07:15','07:35','早餐','蛋白质＋主食＋水果','核心'),item('w2-coffee','07:35–07:50','07:35','07:50','咖啡','一杯无糖或少糖咖啡，不续杯','常规'),item('w2-ready','07:50–08:45','07:50','08:45','个人准备','整理用品，可留出少量弹性时间','常规'),item('w2-commute','08:50–08:55','08:50','08:55','上班通勤','单程5分钟，提前5分钟到达','核心'),item('w2-am','09:00–12:00','09:00','12:00','上午工作','约50分钟专注＋10分钟离屏；每小时起身','核心'),item('w2-snack-am','10:30左右','10:30','10:40','可选加餐','不饿不吃；水果/酸奶/牛奶/坚果选一','可选'),item('w2-lunch','12:00–12:40','12:00','12:40','午餐','较多蔬菜＋足量蛋白质＋正常主食','核心'),item('w2-walk','12:40–13:00','12:40','13:00','饭后散步','轻松走10–20分钟','常规'),item('w2-nap','13:00–13:20','13:00','13:20','午休','睡15–20分钟；睡不着就闭眼','常规'),item('w2-buffer','13:20–13:50','13:20','13:50','缓冲准备','喝水、整理下午任务，13:50前准备到岗','常规'),item('w2-pm','14:00–18:00','14:00','18:00','下午工作','口渴就喝水；约每50分钟活动一下','核心'),item('w2-snack','16:30左右','16:30','16:40','训练前加餐','蛋白质＋少量碳水；当天最后一次进食','核心'),item('w2-wrap','17:45–18:00','17:45','18:00','工作收尾','写明天最重要的1–3件事','常规'),item('w2-home','18:00–18:05','18:00','18:05','下班通勤','单程5分钟，到家后先切换状态','常规'),item('w2-exercise','18:30–19:15','18:30','19:15','运动','按精力选择力量/有氧/快走/散步＋拉伸','核心'),item('w2-recover','19:15以后','19:15','20:00','洗澡＋恢复','不吃正式晚餐，正常喝水','核心'),item('w2-study1','20:00–21:00','20:00','21:00','第一轮学习','只确定一个核心任务','核心'),item('w2-break','21:00–21:10','21:00','21:10','离屏休息','走动、看远处、喝水、简单伸展','常规'),item('w2-study2','21:10–22:00','21:10','22:00','第二轮学习','复习、整理或阅读；疲劳时改轻松活动','常规'),item('w2-night','22:00–23:00','22:00','23:00','睡前收尾','洗漱、收拾用品、降低灯光和手机刺激','核心'),item('w2-sleep','23:00','23:00','23:59','睡觉','固定入睡时间','核心')];
    const recovery=[item('sun-wake','06:50–07:35','06:50','07:35','温和起床＋早餐','保持起床锚点，可适当放慢速度','核心'),item('sun-free','08:00–10:00','08:00','10:00','自由时间','处理个人事务或轻松外出','可选'),item('sun-tidy','10:00–11:00','10:00','11:00','环境整理','整理房间、衣物和下周用品','常规'),item('sun-lunch','12:00–13:20','12:00','13:20','午餐＋散步＋午休','沿用工作日午间结构','核心'),item('sun-social','14:00–16:00','14:00','16:00','兴趣/社交','不安排高压力产出任务','可选'),item('sun-snack','16:30','16:30','16:45','加餐','蛋白质＋少量碳水','常规'),item('sun-review','17:00–17:30','17:00','17:30','一周复盘','更新下周工作一的3天','核心'),item('sun-move','18:30–19:00','18:30','19:00','轻活动','散步或拉伸30分钟，不追求强度','常规'),item('sun-plan','20:00–21:00','20:00','21:00','下周准备','准备衣物、用品、早餐和工作材料','核心'),item('sun-night','22:00–23:00','22:00','23:00','睡前收尾','降低灯光和手机刺激','核心'),item('sun-sleep','23:00','23:00','23:59','睡觉','保持固定入睡时间','核心')];
    const schedules={'工作一':workOne,'工作二':workTwo,'恢复日':recovery},weekdayNames=['周日','周一','周二','周三','周四','周五','周六'];
    let workDays=JSON.parse(localStorage.getItem('schedule-work-one-days')||'[2,3,4]'),completed=JSON.parse(localStorage.getItem('schedule-completed')||'{}'),reminders=JSON.parse(localStorage.getItem('schedule-reminders')||'{}'),notificationsOn=localStorage.getItem('schedule-notifications')==='true',lastMinute='';
    const $=id=>document.getElementById(id),toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m},dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,typeFor=d=>d===0?'恢复日':workDays.includes(d)?'工作一':'工作二';
    const at=(date,time)=>{const[h,m]=time.split(':').map(Number),x=new Date(date);x.setHours(h,m,0,0);return x},formatSeconds=n=>[Math.floor(Math.max(n,0)/3600),Math.floor(Math.max(n,0)%3600/60),Math.max(n,0)%60].map(v=>String(v).padStart(2,'0')).join(' : ');

    function renderWeek(){
      $('dayPicker').innerHTML=[1,2,3,4,5,6].map(d=>`<button class="day-button ${workDays.includes(d)?'selected':''}" data-day="${d}">${workDays.includes(d)?'✓ ':''}${weekdayNames[d]}</button>`).join('');
      $('selectedCount').textContent=`已选择 ${workDays.length}/3 天`;const days=weekDates();$('weekStart').textContent=dateKey(days[0])+' 起';
      $('weekRows').innerHTML=days.map(d=>{const type=typeFor(d.getDay()),desc=type==='工作一'?'09:00–17:30 · 通勤40分钟':type==='工作二'?'09:00–12:00；14:00–18:00':'恢复、整理与下周准备',color=type==='工作一'?'#315d3c':type==='工作二'?'#d59a37':'#8b7bb4';return `<div class="week-row"><div class="week-date"><small>${weekdayNames[d.getDay()]}</small><b>${d.getDate()}</b></div><div class="divider"></div><div><h3>${type}</h3><p>${desc}</p></div><i class="dot" style="background:${color}"></i></div>`}).join('');
      document.querySelectorAll('.day-button').forEach(b=>b.onclick=()=>{const d=Number(b.dataset.day);if(workDays.includes(d))workDays=workDays.filter(x=>x!==d);else if(workDays.length<3)workDays=[...workDays,d].sort();else return showToast('请先取消一天，再选择新的工作日');localStorage.setItem('schedule-work-one-days',JSON.stringify(workDays));renderWeek();renderToday()});
    }
    function currentState(now=new Date()){
      const type=typeFor(now.getDay()),list=schedules[type],minute=now.getHours()*60+now.getMinutes(),current=[...list].filter(x=>toMin(x.start)<=minute&&minute<toMin(x.end)).sort((a,b)=>toMin(b.start)-toMin(a.start))[0]||null,next=list.find(x=>toMin(x.start)>minute)||null,nextDay=new Date(now.getTime()+86400000),target=current?at(now,current.end):next?at(now,next.start):at(nextDay,schedules[typeFor(nextDay.getDay())][0].start);return{type,list,minute,current,next,target};
    }
    function renderToday(){
      const now=new Date(),state=currentState(now),key=dateKey(now),doneCount=state.list.filter(x=>completed[`${key}|${x.id}`]).length,itemNow=state.current||state.next;
      $('dateLabel').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(now)+' · '+state.type;$('countLabel').textContent=`${doneCount}/${state.list.length}`;$('progressBar').style.width=`${Math.round(doneCount/state.list.length*100)}%`;
      $('focusBadge').textContent=state.current?'正在进行':state.next?'下一项':'今日完成';$('focusTime').textContent=itemNow?.time||'明天见';$('focusTitle').textContent=itemNow?.title||'保持固定睡眠';$('focusStandard').textContent=itemNow?.standard||'今天的安排已结束，准备明天继续。';$('timerLabel').textContent=state.current?'距本项结束':'距下一项开始';$('countdown').textContent=formatSeconds(Math.floor((state.target-now)/1000));
      $('timeline').innerHTML=state.list.map(x=>{const done=!!completed[`${key}|${x.id}`],cur=state.current?.id===x.id,past=toMin(x.end)<=state.minute,on=reminders[x.id]!==false,pc=x.priority==='核心'?'core':x.priority==='可选'?'optional':'normal';return `<article class="task ${cur?'current':''} ${done?'done':''}"><input class="check" type="checkbox" data-check="${x.id}" ${done?'checked':''} aria-label="完成${x.title}"><div><div class="task-meta"><span class="task-time">${x.time}</span><span class="priority ${pc}">${x.priority}</span>${cur?'<span class="status">进行中</span>':past&&!done?'<span class="status" style="color:#9a6b52">待补卡</span>':''}</div><h3>${x.title}</h3><p>${x.standard}</p></div><button class="bell ${on?'':'off'}" data-bell="${x.id}" aria-label="${on?'关闭':'开启'}提醒">${on?'🔔':'🔕'}</button></article>`}).join('');
      document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{const k=`${key}|${el.dataset.check}`;completed[k]=el.checked;localStorage.setItem('schedule-completed',JSON.stringify(completed));renderToday()});
      document.querySelectorAll('[data-bell]').forEach(el=>el.onclick=()=>{const id=el.dataset.bell;reminders[id]=reminders[id]===false;localStorage.setItem('schedule-reminders',JSON.stringify(reminders));renderToday();showToast(reminders[id]===false?'已关闭该项提醒':'已开启该项提醒')});
    }
    function openModal(x){$('modalTitle').textContent=x.title;$('modalMeta').textContent=`${x.time} · ${x.priority}`;$('modalStandard').textContent=x.standard;$('modal').classList.add('open')}
    function tick(){renderToday();const now=new Date(),stamp=`${dateKey(now)}-${now.getHours()}:${now.getMinutes()}`;if(stamp===lastMinute)return;lastMinute=stamp;if(!notificationsOn)return;const state=currentState(now),exact=state.list.find(x=>x.start===`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`);if(exact&&reminders[exact.id]!==false){openModal(exact);if('Notification'in window&&Notification.permission==='granted')new Notification(`${exact.time} · ${exact.title}`,{body:exact.standard,tag:stamp+'-'+exact.id})}}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});
    $('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};$('testPopup').onclick=()=>openModal(currentState().list[0]);$('notificationSwitch').checked=notificationsOn;
    $('notificationSwitch').onchange=async e=>{let value=e.target.checked;if(value&&'Notification'in window){const permission=await Notification.requestPermission();if(permission!=='granted'){value=false;e.target.checked=false;showToast('系统通知未授权，页面内弹窗仍可使用')}}notificationsOn=value;localStorage.setItem('schedule-notifications',String(value));showToast(value?'到点弹窗已开启':'到点弹窗已关闭')};
    const esc=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'),ics=d=>{const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`};
    $('exportCalendar').onclick=()=>{if(workDays.length!==3)return showToast('请先选满工作一的3天');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//我的时间执行表//CN','CALSCALE:GREGORIAN'],days=weekDates();for(const d of days){const type=typeFor(d.getDay());for(const x of schedules[type]){if(reminders[x.id]===false)continue;lines.push('BEGIN:VEVENT',`UID:${dateKey(d)}-${x.id}@my-schedule`,`DTSTAMP:${ics(new Date())}`,`DTSTART:${ics(at(d,x.start))}`,`DTEND:${ics(at(d,x.end))}`,`SUMMARY:${esc(x.time+' '+x.title)}`,`DESCRIPTION:${esc('执行标准：'+x.standard+'\n日程类型：'+type+'\n重要程度：'+x.priority)}`,'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY',`DESCRIPTION:${esc(x.title+'｜'+x.standard)}`,'END:VALARM','END:VEVENT')}}lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`我的时间执行表-${dateKey(days[0])}.ics`;a.click();URL.revokeObjectURL(url);showToast('本周系统提醒已生成')};
    renderWeek();tick();setInterval(tick,1000);
  </script>
</body>
